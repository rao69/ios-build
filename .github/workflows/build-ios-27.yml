name: Build iOS IPA (iOS27 Preview)
on:
  workflow_dispatch:
    inputs:
      project:
        description: '工程包名称（对应 Release tag 前缀，如 ET / TYDGY）'
        required: true
        default: 'ET'
        type: string
      export_method:
        description: '导出类型（TestFlight/上架选 app-store）'
        required: true
        default: 'app-store'
        type: choice
        options:
          - app-store
          - ad-hoc
          - development
      build_number:
        description: 'CFBundleVersion（留空则自动用本次构建序号，重跑时请手填更大的数字）'
        required: false
        default: ''
        type: string
      upload_to_testflight:
        description: '构建完成后上传 TestFlight（失败可单独重跑上传 job）'
        required: true
        default: true
        type: boolean
      run_validate:
        description: '构建后向 Apple 预校验（多耗约 1.5 分钟，出问题时再打开）'
        required: false
        default: false
        type: boolean

env:
  XCODE_SCHEME: 'Unity-iPhone'

jobs:
  # ===================================================================
  # Job 1：编译 + 导出 ipa  （约 15-20 分钟）
  # 失败或上传失败时，用 "Re-run failed jobs" 只会重跑失败的 job，
  # 这个 job 成功了就不会再编译一次。
  # ===================================================================
  build:
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Download project bundle
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${PROJECT}" ]; then
            echo "::error::project 参数为空"
            exit 1
          fi
          URL="https://github.com/${REPO}/releases/download/${PROJECT}-latest/${PROJECT}.zip"
          echo "下载工程包: $URL"
          mkdir -p "$RUNNER_TEMP/src"
          curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/project.zip" "$URL" \
            || { echo "::error::下载失败，请确认已用 publish-xcode.ps1 发布过项目 ${PROJECT}"; exit 1; }
          echo "解压中..."
          unzip -q "$RUNNER_TEMP/project.zip" -d "$RUNNER_TEMP/src"
          du -sh "$RUNNER_TEMP/src"
          ls -la "$RUNNER_TEMP/src" | head -20

      - name: Import signing certificate & provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "--- 已导入的签名身份 ---"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/src"
          if [ -f Podfile ]; then
            echo "发现 Podfile，安装依赖..."
            sudo gem install cocoapods --no-document || true
            pod install --repo-update
            ls -d *.xcworkspace || true
          else
            echo "没有 Podfile，跳过 CocoaPods"
          fi

      - name: Set build number
        env:
          INPUT_BN: ${{ github.event.inputs.build_number }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/src"
          if [ -n "${INPUT_BN}" ]; then BN="${INPUT_BN}"; else BN="${RUN_NO}"; fi
          echo "CFBundleVersion 将设为: $BN"
          echo "BUILD_NUMBER=$BN" >> "$GITHUB_ENV"

          # Unity 导出的 Info.plist 里 CFBundleVersion 写死了，必须在 archive 前改掉，
          # 否则重复上传会被 App Store Connect 拒绝：
          #   "The bundle version must be higher than the previously uploaded version"
          find . -maxdepth 3 -name "Info.plist" -type f | while read -r f; do
            if /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$f" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" "$f"
              # 预置出口合规声明：声明本 App 不使用非豁免加密，
              # 上传后 App Store Connect 不再弹 Export Compliance 问卷
              # （也就不会问「是否在法国销售」那一串问题）
              /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$f" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$f"
              echo "  已更新: $f"
            fi
          done

      - name: Prepare entitlements
        run: |
          set -euo pipefail
          # Unity 导出的工程没有 .entitlements 文件，导致 UDP 组播/广播能力
          # (com.apple.developer.networking.multicast) 没有写进签名，
          # 局域网联机就发不出广播。这里补一份，签名时合并进包里。
          cat > "$RUNNER_TEMP/app.entitlements" <<'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.networking.multicast</key>
              <true/>
          </dict>
          </plist>
          ENTEOF
          echo "--- 生成的 entitlements ---"
          cat "$RUNNER_TEMP/app.entitlements"

      - name: Add privacy manifest
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/src"

          # UnityFramework 属于 Apple 认定的「常用第三方 SDK」，必须带 PrivacyInfo.xcprivacy，
          # 否则上传后会被判 ITMS-91061（二进制文件无效）。
          # 内容按 Unity 官方模板：不跟踪、不收集数据，只声明用到的 Required Reason API。
          cat > PrivacyInfo.xcprivacy <<'PRIVEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NSPrivacyTracking</key>
              <false/>
              <key>NSPrivacyTrackingDomains</key>
              <array/>
              <key>NSPrivacyCollectedDataTypes</key>
              <array/>
              <key>NSPrivacyAccessedAPITypes</key>
              <array>
                  <dict>
                      <key>NSPrivacyAccessedAPIType</key>
                      <string>NSPrivacyAccessedAPICategoryUserDefaults</string>
                      <key>NSPrivacyAccessedAPITypeReasons</key>
                      <array>
                          <string>CA92.1</string>
                      </array>
                  </dict>
                  <dict>
                      <key>NSPrivacyAccessedAPIType</key>
                      <string>NSPrivacyAccessedAPICategoryFileTimestamp</string>
                      <key>NSPrivacyAccessedAPITypeReasons</key>
                      <array>
                          <string>C617.1</string>
                      </array>
                  </dict>
                  <dict>
                      <key>NSPrivacyAccessedAPIType</key>
                      <string>NSPrivacyAccessedAPICategorySystemBootTime</string>
                      <key>NSPrivacyAccessedAPITypeReasons</key>
                      <array>
                          <string>35F9.1</string>
                      </array>
                  </dict>
                  <dict>
                      <key>NSPrivacyAccessedAPIType</key>
                      <string>NSPrivacyAccessedAPICategoryDiskSpace</string>
                      <key>NSPrivacyAccessedAPITypeReasons</key>
                      <array>
                          <string>E174.1</string>
                      </array>
                  </dict>
                  <dict>
                      <key>NSPrivacyAccessedAPIType</key>
                      <string>NSPrivacyAccessedAPICategoryActiveKeyboards</string>
                      <key>NSPrivacyAccessedAPITypeReasons</key>
                      <array>
                          <string>54BD.1</string>
                      </array>
                  </dict>
              </array>
          </dict>
          </plist>
          PRIVEOF

          echo "--- 校验生成的 plist ---"
          /usr/libexec/PlistBuddy -c "Print :NSPrivacyAccessedAPITypes:4:NSPrivacyAccessedAPIType" PrivacyInfo.xcprivacy

          # 把文件注册进 Xcode 工程资源，让主 app 和 UnityFramework 都把它打包进去
          sudo gem install xcodeproj --no-document >/dev/null 2>&1 || true
          ruby <<'RUBYEOF'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Unity-iPhone.xcodeproj')
          ref = project.main_group.new_file('PrivacyInfo.xcprivacy')
          %w[Unity-iPhone UnityFramework].each do |name|
            target = project.targets.find { |t| t.name == name }
            next unless target
            if target.resources_build_phase.files_references.include?(ref)
              puts "  #{name}: 已存在"
            else
              target.add_resources([ref])
              puts "  #{name}: 已添加 PrivacyInfo.xcprivacy"
            end
          end
          project.save
          RUBYEOF

      - name: Fix iOS deployment target
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/src"

          # Xcode 27 起，工程里的 IPHONEOS_DEPLOYMENT_TARGET 只允许 15.0 ~ 27.1，
          # Unity 导出的工程写死 11.0，archive 直接失败：
          #   error: The iOS deployment target 'IPHONEOS_DEPLOYMENT_TARGET' is set to 11.0,
          #          but the range of supported deployment target versions is 15.0 to 27.1.x.
          #          (in target 'UnityFramework' / 'Unity-iPhone')
          IOS_MIN="15.0"

          echo "--- 修改前（各 target 的部署目标）---"
          grep -rhoE 'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;' . 2>/dev/null | sort | uniq -c || true

          # 主工程、UnityFramework、Pods 工程、各种 xcconfig 一起改，
          # 避免某个 target 用 xcconfig 把命令行设置覆盖回去
          find . -type f \( -name 'project.pbxproj' -o -name '*.xcconfig' \) -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do
                /usr/bin/sed -i '' -E "s/(IPHONEOS_DEPLOYMENT_TARGET = )[0-9.]+;/\1${IOS_MIN};/g" "$f"
              done

          # Podfile 的 platform 行（存在就一起抬高，避免后续 pod 操作按 11.0 校验）
          if [ -f Podfile ] && grep -qE "^platform :ios" Podfile; then
            /usr/bin/sed -i '' -E "s/^platform :ios, *['\"][0-9.]+['\"]/platform :ios, '${IOS_MIN}'/" Podfile
            echo "Podfile platform 已改为 ${IOS_MIN}"
          fi

          echo "--- 修改后（各 target 的部署目标）---"
          grep -rhoE 'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;' . 2>/dev/null | sort | uniq -c || true

          if grep -rqE 'IPHONEOS_DEPLOYMENT_TARGET = 1[0-4]\.' . 2>/dev/null; then
            echo "::warning::仍有低于 15.0 的部署目标残留，见上方统计"
          fi

          # 供 archive 步骤在命令行再兜底传一次
          echo "IOS_MIN=${IOS_MIN}" >> "$GITHUB_ENV"

      - name: Build archive
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/src"

          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -1 || true)
          PROJECT_FILE=$(ls -d *.xcodeproj 2>/dev/null | head -1 || true)
          if [ -n "$WORKSPACE" ]; then
            TARGET="-workspace $WORKSPACE"
            echo "使用 workspace: $WORKSPACE"
          elif [ -n "$PROJECT_FILE" ]; then
            TARGET="-project $PROJECT_FILE"
            echo "使用 project: $PROJECT_FILE"
          else
            echo "::error::找不到 .xcworkspace 或 .xcodeproj"
            exit 1
          fi

          # Unity 主 target 用间接变量：PROVISIONING_PROFILE_SPECIFIER = $(PROVISIONING_PROFILE_SPECIFIER_APP)
          # 所以必须传 _APP 后缀，传全局的会污染 UnityFramework（framework 不支持 profile）
          xcodebuild clean archive \
            $TARGET \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            PROVISIONING_PROFILE_SPECIFIER_APP="${{ secrets.PROFILE_NAME }}" \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/app.entitlements" \
            ENABLE_BITCODE=NO \
            IPHONEOS_DEPLOYMENT_TARGET="${IOS_MIN}" \
            -allowProvisioningUpdates \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Export IPA
        env:
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'app-store' }}
        run: |
          set -euo pipefail
          if [ "$EXPORT_METHOD" = "development" ]; then
            CERT_NAME="Apple Development"
          else
            CERT_NAME="Apple Distribution"
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ secrets.TEAM_ID }}</string>
              <key>signingCertificate</key>
              <string>${CERT_NAME}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ secrets.BUNDLE_ID }}</key>
                  <string>${{ secrets.PROFILE_NAME }}</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates

          echo "--- 导出结果 ---"
          ls -lh "$RUNNER_TEMP/export"

      - name: Verify entitlements in IPA
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf check && mkdir -p check
          unzip -q -o export/*.ipa -d check
          APP=$(ls -d check/Payload/*.app | head -1)
          echo "--- 最终包内的 entitlements ---"
          codesign -d --entitlements :- "$APP" 2>/dev/null || true
          echo ""
          echo "--- 最终包内的隐私清单 ---"
          find check/Payload -name "PrivacyInfo.xcprivacy" -print | sed 's|check/Payload/||' || true

      - name: Validate with App Store Connect
        if: ${{ github.event.inputs.run_validate == 'true' }}
        continue-on-error: true
        env:
          ASC_USERNAME: ${{ secrets.ASC_USERNAME }}
          ASC_PASSWORD: ${{ secrets.ASC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -eo pipefail
          ASC_USERNAME="${ASC_USERNAME-}"
          ASC_PASSWORD="${ASC_PASSWORD-}"
          TEAM_ID="${TEAM_ID-}"
          IPA=$(ls "$RUNNER_TEMP/export/"*.ipa | head -1)
          if [ -n "${ASC_USERNAME}" ]; then
            echo "=== 向 Apple 预校验（只校验不上传）==="
            if [ -n "${TEAM_ID}" ]; then
              xcrun altool --validate-app -f "$IPA" -t ios \
                --username "$ASC_USERNAME" \
                --password "$ASC_PASSWORD" \
                --asc-provider "$TEAM_ID" \
                --verbose 2>&1 | tail -60
            else
              xcrun altool --validate-app -f "$IPA" -t ios \
                --username "$ASC_USERNAME" \
                --password "$ASC_PASSWORD" \
                --verbose 2>&1 | tail -60
            fi
          else
            echo "无凭据，跳过预校验"
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: ${{ runner.temp }}/archive.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

  # ===================================================================
  # Job 2：只做上传（约 2-4 分钟）
  # 上传失败时点 "Re-run failed jobs"，只会重跑这个 job，不重新编译。
  # 也可以用独立的 upload-ipa-only.yml 手动指定 run 号补传。
  # ===================================================================
  testflight:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_testflight == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export

      - name: Show IPA
        run: |
          ls -lh "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          # 不用 set -u：ASC_* 都是可选 secret，没配置时 GitHub 不注入环境变量
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_USERNAME: ${{ secrets.ASC_USERNAME }}
          ASC_PASSWORD: ${{ secrets.ASC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -eo pipefail
          ASC_KEY_BASE64="${ASC_KEY_BASE64-}"
          ASC_KEY_ID="${ASC_KEY_ID-}"
          ASC_ISSUER_ID="${ASC_ISSUER_ID-}"
          ASC_USERNAME="${ASC_USERNAME-}"
          ASC_PASSWORD="${ASC_PASSWORD-}"
          TEAM_ID="${TEAM_ID-}"

          IPA=$(ls "$RUNNER_TEMP/export/"*.ipa | head -1)
          echo "准备上传: $IPA"

          if [ -n "${ASC_KEY_BASE64}" ]; then
            echo "认证方式: API Key"
            mkdir -p ~/private_keys
            echo "$ASC_KEY_BASE64" | base64 --decode -o "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            xcrun altool --upload-app -f "$IPA" -t ios \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID" \
              --verbose

          elif [ -n "${ASC_USERNAME}" ]; then
            echo "认证方式: Apple ID + App 专用密码（$ASC_USERNAME）"
            if [ -n "${TEAM_ID}" ]; then
              xcrun altool --upload-app -f "$IPA" -t ios \
                --username "$ASC_USERNAME" \
                --password "$ASC_PASSWORD" \
                --asc-provider "$TEAM_ID" \
                --verbose
            else
              xcrun altool --upload-app -f "$IPA" -t ios \
                --username "$ASC_USERNAME" \
                --password "$ASC_PASSWORD" \
                --verbose
            fi

          else
            echo "::warning::未配置上传凭据，跳过（ipa 可在 Artifacts 下载）"
            exit 0
          fi

          echo "上传完成，去 App Store Connect → TestFlight 查看（通常 5-15 分钟处理）"
