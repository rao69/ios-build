name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      project:
        description: '工程包名称（对应 Release tag 前缀，如 ET / TYDGY）'
        required: true
        default: 'ET'
        type: string
      export_method:
        description: '导出类型（app-store = TestFlight/上架；ad-hoc = 指定设备；development = 真机调试）'
        required: true
        default: 'app-store'
        type: choice
        options:
          - app-store
          - ad-hoc
          - development
      upload_to_testflight:
        description: '构建完成后自动上传 TestFlight（需先配置 ASC API Key）'
        required: true
        default: true
        type: boolean
  # 推送到 main 时构建仓库根目录下的工程（兼容旧用法）
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

env:
  XCODE_SCHEME: 'Unity-iPhone'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Download project bundle
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${PROJECT:-}" ]; then
            echo "未指定 project，使用仓库根目录下的工程"
            exit 0
          fi

          URL="https://github.com/${REPO}/releases/download/${PROJECT}-latest/${PROJECT}.zip"
          echo "下载工程包: $URL"
          mkdir -p "$RUNNER_TEMP/src"
          curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/project.zip" "$URL" \
            || { echo "::error::下载失败，请确认已用 publish-xcode.ps1 发布过项目 ${PROJECT}"; exit 1; }

          echo "解压中..."
          unzip -q "$RUNNER_TEMP/project.zip" -d "$RUNNER_TEMP/src"
          du -sh "$RUNNER_TEMP/src"
          echo "--- 工程根目录内容 ---"
          ls -la "$RUNNER_TEMP/src" | head -20

      - name: Import signing certificate & provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "--- 已导入的签名身份 ---"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/src" ]; then SRC_DIR="$RUNNER_TEMP/src"; else SRC_DIR="$(pwd)"; fi
          cd "$SRC_DIR"
          if [ -f Podfile ]; then
            echo "发现 Podfile，安装依赖..."
            sudo gem install cocoapods --no-document || true
            pod install --repo-update
            ls -d *.xcworkspace || true
          else
            echo "没有 Podfile，跳过 CocoaPods"
          fi

      - name: Build archive
        env:
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'app-store' }}
        run: |
          set -euo pipefail

          if [ -d "$RUNNER_TEMP/src" ]; then SRC_DIR="$RUNNER_TEMP/src"; else SRC_DIR="$(pwd)"; fi
          cd "$SRC_DIR"
          echo "编译目录: $(pwd)"

          # 自动识别工程：优先 workspace，其次 project
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -1 || true)
          PROJECT_FILE=$(ls -d *.xcodeproj 2>/dev/null | head -1 || true)
          if [ -n "$WORKSPACE" ]; then
            TARGET="-workspace $WORKSPACE"
            echo "使用 workspace: $WORKSPACE"
          elif [ -n "$PROJECT_FILE" ]; then
            TARGET="-project $PROJECT_FILE"
            echo "使用 project: $PROJECT_FILE"
          else
            echo "::error::找不到 .xcworkspace 或 .xcodeproj"
            exit 1
          fi

          # 签名身份按导出类型决定
          if [ "$EXPORT_METHOD" = "development" ]; then
            CERT_NAME="Apple Development"
          else
            CERT_NAME="Apple Distribution"
          fi
          echo "签名身份: $CERT_NAME"

          xcodebuild clean archive \
            $TARGET \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            CODE_SIGN_IDENTITY="$CERT_NAME" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROFILE_NAME }}" \
            ENABLE_BITCODE=NO \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Export IPA
        env:
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'app-store' }}
        run: |
          set -euo pipefail
          if [ "$EXPORT_METHOD" = "development" ]; then
            CERT_NAME="Apple Development"
          else
            CERT_NAME="Apple Distribution"
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ secrets.TEAM_ID }}</string>
              <key>signingCertificate</key>
              <string>${CERT_NAME}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ secrets.BUNDLE_ID }}</key>
                  <string>${{ secrets.PROFILE_NAME }}</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates

          echo "--- 导出结果 ---"
          ls -lh "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          UPLOAD_ENABLED: ${{ github.event.inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          if [ "${UPLOAD_ENABLED}" != "true" ]; then
            echo "本次未勾选上传 TestFlight，跳过"
            exit 0
          fi
          if [ -z "${ASC_KEY_BASE64}" ]; then
            echo "::warning::未配置 ASC_API_KEY_BASE64，跳过 TestFlight 上传（ipa 仍可在 Artifacts 下载）"
            exit 0
          fi

          mkdir -p ~/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

          IPA=$(ls "$RUNNER_TEMP/export/"*.ipa | head -1)
          echo "准备上传: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

          echo "上传完成，去 App Store Connect → TestFlight 查看处理进度（通常 5-15 分钟）"

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: ${{ runner.temp }}/archive.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
